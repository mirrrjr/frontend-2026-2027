<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            body {
                height: 100dvh;
            }
            .box {
                background-color: aqua;
                text-align: center;
            }

            header {
                height: 50px;
                line-height: 50px;
            }

            nav {
                height: 25px;
                margin-top: 1px;
                line-height: 25px;
            }

            section {
                width: 70%;
                float: right;
                height: 500px;
                line-height: 500px;
                margin-top: 1px;
            }

            aside {
                width: 30%;
                float: right;
                height: 500px;
                line-height: 500px;
                margin-top: 1px;
                outline: 1px solid #fff;
            }

            footer {
                width: 100%;
                height: 100px;
                float: right;
                line-height: 100px;
                margin-top: 1px;
            }
        </style>
    </head>

    <body>
        <header class="box">Header</header>
        <nav class="box">Nav</nav>
        <section class="box">Section</section>
        <aside class="box">Aside</aside>
        <footer class="box">Footer</footer>
    </body>
</html>
